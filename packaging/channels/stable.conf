# Update channel definition of the STABLE build (the default of every build; also part of the public source).
# Read by launcher/build.rs. KEY=value, no spaces around '='.
#
# The stable build knows ONLY the stable channel: it contains no testing endpoint, no testing key, no testing application ID and no code to switch to testing.
# The testing definition is a separate file that exists only in the private development repository and never enters the public source
# (scripts/check_public_source.py refuses it).
CHANNEL=stable
# Minisign public key (the base64 line of the .pub file) that signs the stable update metadata. EMPTY ON PURPOSE until the owner has generated the key pair
# OFFLINE (the private key never goes into CI or into the repository). While it is empty, the launcher update check is disabled and everything else works as before.
UPDATE_PUBLIC_KEY=
