# Central project configuration (shell-sourceable KEY=value; no spaces around '=').
# Rust: launcher/src/project.rs mirrors these values and a test fails if the two differ. Scripts and workflows read this file.
# Change the repository here (and in project.rs) - nowhere else.
# Application version (SemVer 2.0.0): launcher, GUI and Flatpak metainfo share it. The only manually edited source is this line,
# changed with `scripts/version.py set <version>`; `scripts/version.py check` and the tests keep every other place in step.
# See documentation/versioning-policy.md.
APP_VERSION=0.3.0
# Patch manifest format (integer; the `tsw-forever-patch N` header). NOT a version of the engine and NOT a client patch level.
PATCH_MANIFEST_FORMAT=1
PROJECT_NAME=TSW-Forever
GITHUB_OWNER=Glaubenskrieger
GITHUB_REPO=TSW-Forever
REPO_URL=https://github.com/Glaubenskrieger/TSW-Forever
# Flatpak/OSTree repository served by GitHub Pages (the GitHub convention <owner>.github.io/<repo>; lower-case host). NOT yet live.
FLATPAK_REPO_URL=https://glaubenskrieger.github.io/TSW-Forever/repo
# Client patches: assets of the latest GitHub Release (manifest.txt, manifest.txt.minisig and the artifacts). NOT yet published.
PATCH_BASE_URL=https://github.com/Glaubenskrieger/TSW-Forever/releases/latest/download/
# Provisional until the owner decides (see documentation/packaging.md): the ID is part of desktop file, icons and metainfo.
APP_ID=org.tswlauncher.Launcher
