# RELEASE ON TAG. A version tag v<MAJOR>.<MINOR>.<PATCH> pushed by the repository owner PUBLISHES the candidate that build.yml built, tested and checked when the commit was pushed
# to main. Nothing is compiled here. No manual upload. Two human approvals (GitHub environments with required reviewers, enforced by GitHub, not by this file) stand in the way of
# anything public: (1) `flatpak-release` before the release files are put into a draft (the approval of the WHOLE release, Linux and Windows together; the environment keeps its
# historical name), (2) `release-publish` before the draft release is published. GitHub sends the usual approval notification for each.
#
#   guard ........ the tag is the owner's, on main, matches APP_VERSION, and is newer than the newest published release (no downgrade, no re-publish)
#   candidate .... finds the successful build run of EXACTLY the tagged commit (build.yml), checks its artifacts (complete, not expired, SHA-256 against candidate.json) and hands them on
#   approve ...... environment flatpak-release (approval 1): the owner has seen the verified candidate and releases it. The job holds no secret and runs no code of the project.
#   draft ........ the four release files (Flatpak bundle, source archive, Windows installer, SHA256SUMS) go into a DRAFT release and are read back and compared
#   publish ...... environment release-publish (approval 2): the draft is verified again and published (scripts/release_draft.sh)
#
# GitHub Pages is NOT touched by a release: it holds the static web site only (build.yml, job site); the site's download buttons find the files of the newest PUBLISHED release at
# runtime, so a draft never receives a link. There is no signing key, no secret and no variable in this workflow (the former OSTree/GPG signing of 0.4.0 is gone; the integrity of the
# files is given by SHA256SUMS and the release hosting). Permissions: read-only everywhere except `draft` and `publish` (contents: write). There is no workflow_run trigger and no
# other trigger than the owner's tag. Tags are never created by a workflow. A published release is never touched. Failure recovery: re-run the failed jobs only
# (documentation/release-pipeline.md); a failure before `publish` leaves nothing public.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Check out the tagged commit (no stored credentials, full history for the main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag, commit on main, version and pinned actions
        id: verify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "not a version tag: $TAG_NAME" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")" || { echo 'Tag changed after the checkout' >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: releases are made from a tag on main only" >&2; exit 1; }
          python3 scripts/version.py check
          version="$(python3 scripts/version.py show)"
          [ "$TAG_NAME" = "v$version" ] || { echo "tag $TAG_NAME does not match APP_VERSION $version" >&2; exit 1; }
          scripts/pin_actions.sh --check
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The version must be newer than the newest published release (refuses a downgrade and a re-publish; drafts do not count)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -1)"
          if [ -z "$latest" ]; then echo "no published release yet: $VERSION is the first"; exit 0; fi
          [ "$(python3 scripts/version.py compare "$VERSION" "$latest")" = 1 ] || { echo "$VERSION is not newer than the published release $latest" >&2; exit 1; }
          echo "$VERSION is newer than the published release $latest"

  # NO build happens in this workflow. The candidate (Flatpak bundle, source archive, Windows installer) was built, tested and checked by build.yml when the commit was
  # pushed to main. This job finds that run for EXACTLY the tagged commit, requires it to be successful and complete, checks every file against the run's candidate.json (version,
  # full commit id, SHA-256) and hands the verified files to the following jobs as artifacts of this run. No run, a failed run, an expired artifact or any difference stops the release;
  # a newer commit's or another run's artifacts are never used. Expired (30 days): owner runs `gh workflow run build.yml --ref <tag>` and pushes nothing new, then re-runs this workflow.
  candidate:
    needs: guard
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      build_run: ${{ steps.find.outputs.run_id }}
      flatpak_artifact: tsw-forever-${{ needs.guard.outputs.version }}-flatpak-${{ github.sha }}
      windows_artifact: tsw-forever-${{ needs.guard.outputs.version }}-windows-${{ github.sha }}
    steps:
      - name: Check out the tagged commit (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the successful build of exactly this commit and check that its artifacts are complete and not expired
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" --status success --limit 50 --json databaseId,headSha,conclusion,workflowName,createdAt)"
          run_id="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success" and .workflowName == "build")] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")"
          if [ -z "$run_id" ]; then
            echo "There is no successful run of the workflow 'build' for exactly $GITHUB_SHA." >&2
            echo "Push the commit to main and wait for a green build, or start 'gh workflow run build.yml --ref $GITHUB_REF_NAME'. Nothing is built here and nothing was published." >&2
            exit 1
          fi
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')"
          for kind in flatpak source windows candidate; do
            grep -qx "tsw-forever-${VERSION}-${kind}-${GITHUB_SHA}" <<<"$names" || { echo "artifact tsw-forever-${VERSION}-${kind}-${GITHUB_SHA} of build run $run_id is missing or expired; run 'gh workflow run build.yml --ref $GITHUB_REF_NAME' and re-run this workflow" >&2; exit 1; }
          done
          echo "build run $run_id is the build of $GITHUB_SHA"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the artifacts of that build run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tsw-forever-${{ needs.guard.outputs.version }}-*-${{ github.sha }}
          path: all
          run-id: ${{ steps.find.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify every file against the candidate manifest of the build run
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p manifest parts
          mv "all/tsw-forever-${VERSION}-candidate-${GITHUB_SHA}/candidate.json" manifest/candidate.json
          rmdir "all/tsw-forever-${VERSION}-candidate-${GITHUB_SHA}"
          for kind in flatpak source windows; do mv "all/tsw-forever-${VERSION}-${kind}-${GITHUB_SHA}" parts/; done
          test -z "$(ls -A all)" || { echo "unexpected artifacts: $(ls all)" >&2; exit 1; }
          python3 -I scripts/release_candidate.py verify parts manifest/candidate.json --version "$VERSION" --commit "$GITHUB_SHA"

      - name: Hand over the verified Flatpak bundle (kept 7 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ needs.guard.outputs.version }}-flatpak-${{ github.sha }}
          path: parts/tsw-forever-${{ needs.guard.outputs.version }}-flatpak-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7

      - name: Hand over the verified source archive (kept 7 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ needs.guard.outputs.version }}-source-${{ github.sha }}
          path: parts/tsw-forever-${{ needs.guard.outputs.version }}-source-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7

      - name: Hand over the verified Windows installer (kept 7 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ needs.guard.outputs.version }}-windows-${{ github.sha }}
          path: parts/tsw-forever-${{ needs.guard.outputs.version }}-windows-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7

  # The approval of the whole release (Linux and Windows together). GitHub holds this job until a required reviewer of the environment approves it (and sends the notification).
  # Nothing runs here: no checkout, no script of the project, no secret. A refusal or a timeout stops the release before anything is put into a draft.
  approve:
    needs: [guard, candidate]
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: flatpak-release
    permissions:
      contents: read
    steps:
      - name: The release was approved
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          BUILD_RUN: ${{ needs.candidate.outputs.build_run }}
        run: echo "Release $VERSION of commit $GITHUB_SHA (build run $BUILD_RUN) was approved by the environment reviewer."

  draft:
    needs: [guard, candidate, approve]
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Flatpak bundle, the source archive and the Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tsw-forever-${{ needs.guard.outputs.version }}-*-${{ github.sha }}
          path: parts

      - name: Assemble the four release files and verify the set
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          case "${{ needs.candidate.outputs.windows_artifact }}" in *"-$v-"*"-$GITHUB_SHA") ;; *) echo "Windows artifact name does not carry version $v and commit $GITHUB_SHA" >&2; exit 1;; esac
          (cd "parts/${{ needs.candidate.outputs.windows_artifact }}" && sha256sum -c SHA256SUMS-windows)
          (cd "parts/tsw-forever-${v}-source-${GITHUB_SHA}" && sha256sum -c SHA256SUMS-source)
          mkdir -p dist
          (cd "parts/tsw-forever-${v}-flatpak-${GITHUB_SHA}" && sha256sum -c SHA256SUMS-flatpak)
          cp "parts/tsw-forever-${v}-flatpak-${GITHUB_SHA}/tsw-forever-${v}.flatpak" "dist/tsw-forever-${v}.flatpak"
          cp "parts/tsw-forever-${v}-source-${GITHUB_SHA}/tsw-forever-${v}-src.tar.gz" dist/
          cp "parts/${{ needs.candidate.outputs.windows_artifact }}/tsw-forever-${v}-windows-setup.exe" dist/
          (cd dist && sha256sum "tsw-forever-${v}.flatpak" "tsw-forever-${v}-src.tar.gz" "tsw-forever-${v}-windows-setup.exe" > SHA256SUMS && cat SHA256SUMS)
          python3 -I scripts/check_release_set.py dist --version "$v" --with-windows
          python3 -I scripts/check_public_source.py "dist/tsw-forever-${v}-src.tar.gz"
          python3 -I scripts/check_release_artifacts.py "dist/tsw-forever-${v}-src.tar.gz"
          tar xzOf "dist/tsw-forever-${v}-src.tar.gz" "tsw-forever-${v}/packaging/project.conf" | grep -qx "APP_VERSION=$v"

      - name: Extract release notes from the matching changelog entry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['TAG_NAME'][1:]
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = re.compile(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', re.M | re.S)
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              raise SystemExit(f'No changelog entry for {version}')
          pathlib.Path('release-notes.md').write_text(f'# TSW-Forever {version}\n\n' + match.group(1).strip() + '\n', encoding='utf-8')
          PY

      - name: Fill the DRAFT release, read the files back and compare them (nothing is published here)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/release_draft.sh upload "$TAG_NAME" release-notes.md dist

      - name: Keep the verified release files for the final check (kept 7 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ needs.guard.outputs.version }}-release-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, draft]
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsw-forever-${{ needs.guard.outputs.version }}-release-dist-${{ github.sha }}
          path: dist

      - name: Verify the draft once more (still a draft, exactly four files, byte-identical), publish it and read the result back
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/release_draft.sh publish "$TAG_NAME" dist
