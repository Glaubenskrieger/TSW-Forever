# The ONE automated release process. A version tag v<MAJOR>.<MINOR>.<PATCH> pushed by the repository owner builds the complete release set from the tagged
# commit (release-set.yml: Linux Flatpak + source archive, Windows installer, SHA256SUMS), verifies it and publishes exactly four files to a GitHub release:
#   tsw-forever-<version>.flatpak, tsw-forever-<version>-src.tar.gz, tsw-forever-<version>-windows-setup.exe, SHA256SUMS.
# The same file works unchanged in the private development repository and in the public repository: it contains no repository name, no secret and no
# private path. Only the publish job has write permission (contents: write); the build jobs are read-only. A release is created as a DRAFT, its assets are
# uploaded and downloaded again for comparison, and only then it is made public. An existing release is never replaced. Tags are never created by a workflow.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: The tag must be an exact numeric version tag (GitHub's filter is only a glob)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "not a version tag: $TAG_NAME" >&2; exit 1; }

  set:
    needs: guard
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    uses: ./.github/workflows/release-set.yml
    permissions:
      contents: read

  publish:
    needs: [guard, set]
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the tagged commit (no stored credentials, full history for the main check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag, checkout, main and version; refuse an existing release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "not a version tag: $TAG_NAME" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")" || { echo 'Tag changed after the build' >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: releases are made from a tag on main only" >&2; exit 1; }
          python3 scripts/version.py check
          version="$(python3 scripts/version.py show)"
          [ "$TAG_NAME" = "v$version" ] || { echo "tag $TAG_NAME does not match APP_VERSION $version" >&2; exit 1; }
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it or its assets' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the verified release set built from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SET_ARTIFACT: ${{ needs.set.outputs.artifact }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          case "$SET_ARTIFACT" in "tsw-forever-$VERSION-release-all-$GITHUB_SHA") ;; *) echo "artifact $SET_ARTIFACT is not the set of this commit and version" >&2; exit 1;; esac
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SET_ARTIFACT" --dir dist
          # BUILD-INFO.txt documents the build and is not a release file
          rm -f dist/BUILD-INFO.txt
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          test -s "dist/tsw-forever-$VERSION.flatpak"
          test -s "dist/tsw-forever-$VERSION-src.tar.gz"
          test -s "dist/tsw-forever-$VERSION-windows-setup.exe"
          test -s dist/SHA256SUMS
          python3 -I scripts/check_release_set.py dist --version "$VERSION" --with-windows
          python3 -I scripts/check_public_source.py "dist/tsw-forever-$VERSION-src.tar.gz"

      - name: Extract release notes from the matching changelog entry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['TAG_NAME'][1:]
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = re.compile(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', re.M | re.S)
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              raise SystemExit(f'No changelog entry for {version}')
          pathlib.Path('release-notes.md').write_text(f'# TSW-Forever {version}\n\n' + match.group(1).strip() + '\n', encoding='utf-8')
          PY

      - name: Upload to a new draft, verify the remote assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          gh release create "$TAG_NAME" --draft --verify-tag --title "TSW-Forever ${version}" --notes-file release-notes.md
          gh release upload "$TAG_NAME" \
            "dist/tsw-forever-${version}.flatpak" \
            "dist/tsw-forever-${version}-src.tar.gz" \
            "dist/tsw-forever-${version}-windows-setup.exe" \
            dist/SHA256SUMS
          mkdir -p downloaded
          gh release download "$TAG_NAME" --dir downloaded
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
          test "$(find downloaded -maxdepth 1 -type f | wc -l)" -eq 4
          gh release edit "$TAG_NAME" --draft=false
