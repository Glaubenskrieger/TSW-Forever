# Builds the release Flatpak BUNDLE (branch local like every earlier bundle, so that an installed version is updated in place; one installable file, no hosted repository) and the deterministic source archive from the CHECKED-IN sources of one ref, runs the
# full test suite before anything is built, installs the bundle once to audit it, and hands both over as workflow artifacts (with SHA-256 files). Called by build.yml (build on push). It holds NO
# key, NO secret and NO write permission, creates no release, tag or commit and publishes nothing. The release tag later publishes exactly these files (release.yml, job candidate).
# A RELEASE is told from a developer build by build metadata (TSW_RELEASE_BUILD=1 stages packaging/release-build, launcher/build.rs turns it into the release marker), not by the branch.
# There is no OSTree repository to host and no signing: the bundle is the same kind of file that users have installed with `flatpak install --user <file>.flatpak` before; its integrity
# is given by the SHA-256 file and by GitHub's release hosting.
name: flatpak-stable-build
on:
  workflow_call:
    outputs:
      flatpak_artifact:
        description: "Name of the artifact that holds the Flatpak bundle and its checksum"
        value: ${{ jobs.build.outputs.flatpak_artifact }}
      source_artifact:
        description: "Name of the artifact that holds the source archive and its checksum"
        value: ${{ jobs.build.outputs.source_artifact }}
      version:
        description: "APP_VERSION of the built commit"
        value: ${{ jobs.build.outputs.version }}
permissions:
  contents: read
concurrency:
  group: flatpak-stable-build-${{ github.sha }}
  cancel-in-progress: false
env:
  FREEDESKTOP_VERSION: "25.08"
  RUST_VERSION: "1.99.0"
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      flatpak_artifact: tsw-forever-${{ steps.version.outputs.version }}-flatpak-${{ github.sha }}
      source_artifact: tsw-forever-${{ steps.version.outputs.version }}-source-${{ github.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository (read-only token, no stored credentials, full history for the main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a commit that is not part of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: artifacts are built from main or from a tag on main only" >&2; exit 1; }
      - name: Read and check the version; a tag must be v<APP_VERSION>
        id: version
        run: |
          scripts/version.py check
          version="$(scripts/version.py show)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match APP_VERSION $version (expected v$version)" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse unpinned actions
        run: scripts/pin_actions.sh --check
      - name: Disk report - runner start (baseline)
        run: scripts/ci_disk_report.sh "1 runner start"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common rsync desktop-file-utils appstream python3 python3-yaml libarchive-tools jq libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxi-dev ostree
      - name: Allow the unprivileged user namespaces that flatpak-builder (bubblewrap) needs on Ubuntu 24.04 (setting of this runner VM only)
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Install the pinned Freedesktop runtime, SDK and Rust extension
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            "org.freedesktop.Platform//${FREEDESKTOP_VERSION}" \
            "org.freedesktop.Sdk//${FREEDESKTOP_VERSION}" \
            "org.freedesktop.Sdk.Extension.rust-stable//${FREEDESKTOP_VERSION}"
      - name: Install the pinned Rust toolchain for the source archive check
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Disk report - after the installation of the Flatpak runtime, SDK and Rust toolchain
        run: scripts/ci_disk_report.sh "2 after installing runtime, SDK and Rust"
      - name: Fetch the crates of the committed Cargo.lock for the tests (network step 1 of 2)
        run: scripts/build_flatpak.sh fetch --allow-network
      - name: Tests (launcher, GUI, patcher, packaging policy and the release scripts) - before any artifact is built
        env:
          TSW_REQUIRE_TOOLS: "1"  # the Flatpak tests must run here (flatpak is installed above), never be skipped for a missing program
        run: |
          scripts/build_flatpak.sh test
          python3 -I scripts/test_check_release_artifacts.py
          python3 -I scripts/test_check_release_set.py
      - name: Check the Flatpak package (manifest, staged sources, desktop file, metainfo)
        run: scripts/build_flatpak.sh check
      - name: Free the disk space of the test builds (the runner disk also holds the Flatpak runtime and SDK and the vendored crates)
        run: |
          scripts/ci_disk_report.sh "3 after the tests, before cleanup 1"
          rm -rf launcher/target launcher-gui/target patcher/target
          scripts/ci_disk_report.sh "4 after cleanup 1 (test builds removed)"
      - name: Vendor the crates of the committed Cargo.lock (network step 2 of 2)
        run: scripts/build_flatpak.sh vendor --allow-network
      - name: Build the release Flatpak (branch local, release build metadata; offline from here on)
        env:
          TSW_RELEASE_BUILD: "1"
        run: scripts/build_flatpak.sh build
      - name: Export the bundle (no update source, no key inside) and write its checksum
        env:
          TSW_RELEASE_BUILD: "1"
        run: |
          set -euo pipefail
          scripts/build_flatpak.sh bundle
          v="${{ steps.version.outputs.version }}"
          mkdir -p build/flatpak-out
          cp build/flatpak/tsw-launcher.flatpak "build/flatpak-out/tsw-forever-${v}.flatpak"
          (cd build/flatpak-out && sha256sum "tsw-forever-${v}.flatpak" | tee SHA256SUMS-flatpak)
      - name: Audit the bundle - install it for the user, check that it starts and reports this version, that it is the release build of the branch local and has no update source, and that no Microsoft or Funcom file, Windows program or game data is inside
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          . packaging/project.conf
          flatpak install --user --noninteractive "build/flatpak-out/tsw-forever-${v}.flatpak"
          reported="$(flatpak run --command=tsw-launch "$APP_ID//local" --version)"
          echo "$reported"
          case "$reported" in *"$v"*) ;; *) echo "the installed Flatpak reports another version than $v" >&2; exit 1;; esac
          flatpak info --user "$APP_ID//local" | grep -q 'Branch: *local' || { echo "the bundle is not the branch local" >&2; exit 1; }
          files="$HOME/.local/share/flatpak/app/$APP_ID/x86_64/local/active/files"
          for program in tsw-launch tsw-launcher; do grep -aq 'tsw-forever-release-build' "$files/bin/$program" || { echo "$program does not carry the release build marker" >&2; exit 1; }; done
          if flatpak remotes --user --columns=url | grep -qi 'github.io'; then echo "the bundle configured an update source: there must be none" >&2; exit 1; fi
          python3 -I scripts/check_release_artifacts.py "$files"
          python3 -I scripts/check_licenses.py "$files/share/licenses/tsw-forever"
      - name: Upload the Flatpak bundle (kept 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ steps.version.outputs.version }}-flatpak-${{ github.sha }}
          path: build/flatpak-out/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'Glaubenskrieger/TSW-Forever' && 30 || 7 }}
      - name: Free the disk space of the Flatpak build (the bundle is exported and audited; the Platform runtime is not needed any more)
        run: |
          scripts/ci_disk_report.sh "5 after the Flatpak build and bundle, before cleanup 2"
          rm -rf build/flatpak/state build/flatpak/build-dir build/flatpak/repo build/flatpak-out
          flatpak uninstall --user --noninteractive "org.freedesktop.Sdk.Extension.rust-stable//${FREEDESKTOP_VERSION}" "org.freedesktop.Sdk//${FREEDESKTOP_VERSION}"
          scripts/ci_disk_report.sh "6 after cleanup 2 (Flatpak build state and SDK removed)"
      - name: Stage the deterministic source archive (built twice, both must have the same hash)
        run: |
          version="${{ steps.version.outputs.version }}"
          scripts/native_stage.sh
          first="$(sha256sum "build/native/tsw-forever-${version}-src.tar.gz" | cut -d' ' -f1)"
          scripts/native_stage.sh
          second="$(sha256sum "build/native/tsw-forever-${version}-src.tar.gz" | cut -d' ' -f1)"
          [ "$first" = "$second" ] || { echo "the source archive is not reproducible: $first != $second" >&2; exit 1; }
          echo "source archive sha256 $first (identical on two runs)"
      - name: Check that the source archive builds on its own (unpacked, vendored crates, offline)
        run: |
          version="${{ steps.version.outputs.version }}"
          check="$GITHUB_WORKSPACE/build/source-check"
          mkdir -p "$check"
          tar xzf "build/native/tsw-forever-${version}-src.tar.gz" -C "$check"
          cd "$check/tsw-forever-${version}"
          python3 -I scripts/version.py check
          mkdir -p .cargo
          printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "%s"\n' "$GITHUB_WORKSPACE/build/flatpak/src/vendor" > .cargo/config.toml
          export CARGO_TARGET_DIR="$check/target"
          for crate in launcher launcher-gui; do
            cargo "+${RUST_VERSION}" check --locked --offline --manifest-path "$crate/Cargo.toml"
          done
      - name: Free the disk space of the source archive check
        run: |
          scripts/ci_disk_report.sh "7 after the source archive check, before cleanup 3"
          rm -rf build/source-check
          scripts/ci_disk_report.sh "8 after cleanup 3 (source archive check removed)"
      - name: Check the source archive and pack it with its checksum
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          mkdir -p build/source-out
          cp "build/native/tsw-forever-${v}-src.tar.gz" build/source-out/
          (cd build/source-out && sha256sum "tsw-forever-${v}-src.tar.gz" | tee SHA256SUMS-source)
          python3 -I scripts/check_public_source.py "build/source-out/tsw-forever-${v}-src.tar.gz"
      - name: Upload the source archive (kept 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ steps.version.outputs.version }}-source-${{ github.sha }}
          path: build/source-out/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'Glaubenskrieger/TSW-Forever' && 30 || 7 }}
      - name: Disk report - end of the job (also after a failure)
        if: ${{ always() }}
        run: scripts/ci_disk_report.sh "9 end of the job"
