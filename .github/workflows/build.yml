# BUILD ON PUSH. Every push to main builds, tests and checks the complete release candidate of that commit, and updates the web site - and publishes NOTHING else:
#   flatpak ...... unsigned stable OSTree repository + source archive (flatpak-stable-build.yml: full test suite first; no key, no secret)
#   windows ...... Windows installer (windows.yml; no key, no secret)
#   candidate .... collects those artifacts of THIS run, writes candidate.json (version, full commit id, SHA-256 of every file; scripts/release_candidate.py) and keeps them 30 days
#   site ......... the web site goes live (GitHub Pages). The published Flatpak data of an earlier release is fetched from the live site, verified against its manifest and the
#                  public key, and deployed again unchanged; before the first release there is none. Only the tip of main is deployed (no rollback by an older run).
# It creates NO release, NO tag, NO commit, activates NO Flatpak update and signs NOTHING: the artifacts wait for the release tag, which publishes exactly these (release.yml,
# job candidate). A manual start (workflow_dispatch) on main or on an existing v-tag rebuilds the artifacts of that commit (for example after the 30 days have passed); the site
# is deployed from main only.
name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  flatpak:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/flatpak-stable-build.yml
    with:
      dry_run: false
    permissions:
      contents: read

  windows:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/windows.yml
    with:
      use_cache: false
    permissions:
      contents: read

  candidate:
    needs: [flatpak, windows]
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ needs.flatpak.outputs.version }}
    steps:
      - name: Check out the built commit (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a commit that is not part of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }

      - name: Download the artifacts of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tsw-forever-${{ needs.flatpak.outputs.version }}-*-${{ github.sha }}
          path: parts

      - name: Write the candidate manifest (version, commit, SHA-256 of every file) and check the source archive
        env:
          VERSION: ${{ needs.flatpak.outputs.version }}
        run: |
          set -euo pipefail
          python3 -I scripts/release_candidate.py create parts --version "$VERSION" --commit "$GITHUB_SHA" --out candidate.json
          (cd "parts/tsw-forever-${VERSION}-windows-${GITHUB_SHA}" && sha256sum -c SHA256SUMS-windows)
          (cd "parts/tsw-forever-${VERSION}-source-${GITHUB_SHA}" && sha256sum -c SHA256SUMS-source)
          {
            echo "### Release candidate ${VERSION}"
            echo "Commit \`${GITHUB_SHA}\` - Linux (unsigned stable repository) and Windows built and checked. Nothing is published: the tag v${VERSION} on exactly this commit publishes these artifacts."
            echo '```'
            cat candidate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check now what the tag would otherwise check later (release notes of this version, source archive audit)
        env:
          VERSION: ${{ needs.flatpak.outputs.version }}
        run: |
          set -euo pipefail
          python3 -I scripts/check_release_artifacts.py "parts/tsw-forever-${VERSION}-source-${GITHUB_SHA}/tsw-forever-${VERSION}-src.tar.gz"
          python3 -I scripts/check_public_source.py "parts/tsw-forever-${VERSION}-source-${GITHUB_SHA}/tsw-forever-${VERSION}-src.tar.gz"
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['VERSION']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit(f'No changelog entry for {version}: the release notes of the tag would be empty')
          PY

      - name: Keep the manifest (30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-${{ needs.flatpak.outputs.version }}-candidate-${{ github.sha }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30

  # The web site alone. GitHub Pages replaces the WHOLE site with every deployment, so the published Flatpak data (if any) is carried over unchanged.
  # One job from reading the live state to the deployment, in the same concurrency group as the release deployment: the two never interleave.
  site:
    needs: candidate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pages-site
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the built commit (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a commit that is not part of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ostree gnupg python3 curl

      - name: Assemble the site (the web site, plus the published Flatpak data unchanged if a release exists)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . packaging/project.conf
          site="${FLATPAK_REPO_URL%/repo}"
          code="$(curl --proto '=https' --proto-redir '=https' --max-redirs 3 -sS -o "$RUNNER_TEMP/channels.json" -w '%{http_code}' "$site/channels.json?nocache=${GITHUB_RUN_ID}")"
          case "$code" in
            404)
              echo "no Flatpak release is published yet: the site is the web site alone"
              python3 -I scripts/assemble_pages_site.py --website-only --website website --out build/site;;
            200)
              echo "a Flatpak release is published: its data is carried over unchanged"
              python3 -I scripts/preserve_live_site.py --site "$site" --out build/live
              scripts/flatpak_keys.sh verify-repo packaging/flatpak/stable-repo.gpg build/live/repo
              cmp "$RUNNER_TEMP/channels.json" build/live/channels.json
              python3 -I scripts/assemble_pages_site.py --repo build/live/repo --refs build/live/refs --channels-json build/live/channels.json --website website --out build/site;;
            *) echo "cannot read the live channel state (HTTP $code); the site is not changed" >&2; exit 1;;
          esac

      - name: Only the tip of main is deployed (an older run never replaces a newer site; the newer run deploys)
        id: tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "current=false" >> "$GITHUB_OUTPUT"; echo "main has moved on to $tip: this run does not deploy"; fi

      - name: Upload the site
        if: ${{ steps.tip.outputs.current == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 7

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.tip.outputs.current == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
