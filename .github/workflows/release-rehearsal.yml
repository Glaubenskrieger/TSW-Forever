# READ-ONLY REHEARSAL OF THE RELEASE CHECKS. Started by hand on main, in the development repository (and harmlessly also in production). It runs the SAME scripts as release.yml on the
# candidate that build.yml built for the commit it runs on - and publishes nothing, ever:
#
#   scripts/release_guard.sh --rehearse         version consistency, commit on main, pinned actions, version newer than the newest published release (the tag is taken as v<APP_VERSION>)
#   scripts/release_candidate_find.sh           the successful `build` run of exactly this commit; complete, not expired artifacts
#   (download of those artifacts, from that run)
#   scripts/release_candidate_verify.sh         every file against candidate.json (version, full commit id, SHA-256)
#   scripts/release_assemble_dist.sh            the four release files, SHA256SUMS, the exact release set, the source audits
#   scripts/release_notes.py                    the changelog entry of the version
#
# What it cannot test (documentation/release-pipeline.md, "Development repository"): a real tag, the approvals of the environments, the draft and publish steps against a real release, Pages.
# Permissions: contents: read and actions: read only. No environment, no secret, no upload, no tag, no release, no push. Costs about two minutes of Linux runner time.
name: release-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-rehearsal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the commit (no stored credentials, full history for the main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a commit that is not part of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }

      - name: Guard checks of the release, without a tag (scripts/release_guard.sh --rehearse)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release_guard.sh --rehearse

      - name: Find the successful build of exactly this commit and check that its artifacts are complete and not expired
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.guard.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release_candidate_find.sh

      - name: Download the artifacts of that build run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tsw-forever-${{ steps.guard.outputs.version }}-*-${{ github.sha }}
          path: all
          run-id: ${{ steps.find.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify every file against the candidate manifest of the build run
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: scripts/release_candidate_verify.sh

      - name: Assemble the four release files and verify the set
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: scripts/release_assemble_dist.sh

      - name: Extract the release notes of the version
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: python3 -I scripts/release_notes.py "v${VERSION}"

      - name: Summary (nothing was published)
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          echo "Rehearsal of the release checks for $VERSION on $GITHUB_SHA passed. NOTHING was published: no tag, no release, no upload, no deployment."
          cat dist/SHA256SUMS
