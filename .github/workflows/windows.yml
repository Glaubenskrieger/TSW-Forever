# Native Windows build of the launcher (tsw-launcher.exe, tsw-launch.exe): formatting, Clippy -D warnings, the Rust test suites, the unsigned
# x64 Inno Setup installer, a silent install/uninstall test of that installer, and SHA-256 sums - all on a real GitHub-hosted Windows runner.
# Build and test workflow. Started by hand (workflow_dispatch, no inputs) or called by release-set.yml. Main or a v<version> tag on main only (job guard plus ancestor check),
# read-only token, no secrets, no signing. It creates no tag, no release, no commit and publishes nothing: the result is a workflow artifact (the release workflow publishes it).
# Every failing step fails the run (no continue-on-error). All build logic lives in scripts/build_windows_installer.ps1 and scripts/test_windows_installer.ps1.
name: windows

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: "Name of the uploaded Windows artifact"
        value: ${{ jobs.windows.outputs.artifact }}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  # Inno Setup is installed from Chocolatey only when the runner image does not carry it; the version is pinned (the package verifies its download checksum)
  INNO_SETUP_VERSION: "6.4.3"

jobs:
  windows:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository (read-only token, no stored credentials, full history for the main check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a commit that is not part of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: Windows packages are built from main only" >&2; exit 1; }

      - name: Read and check the version (a tag must be v<APP_VERSION>); refuse unpinned actions
        id: version
        run: |
          python scripts/version.py check
          scripts/pin_actions.sh --check
          version="$(python scripts/version.py show)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match APP_VERSION $version (expected v$version)" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Name the artifact (version and exact source commit)
        id: names
        run: echo "artifact=tsw-forever-${{ steps.version.outputs.version }}-windows-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain with rustfmt and Clippy
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Formatting
        run: |
          for d in patcher launcher launcher-gui; do (cd "$d" && cargo fmt --check); done

      - name: Clippy (warnings fail the run; network step - crates of the committed Cargo.lock)
        run: |
          for d in patcher launcher launcher-gui; do (cd "$d" && cargo clippy --locked --all-targets -- -D warnings); done

      - name: Rust tests on Windows
        run: |
          # every crate is run and every failing test is reported; the step fails if any of them failed
          failed=0
          for d in patcher launcher launcher-gui; do (cd "$d" && cargo test --locked --no-fail-fast) || failed=1; done
          exit $failed

      - name: Make sure Inno Setup is available (runner image first, pinned Chocolatey package otherwise)
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup --version $env:INNO_SETUP_VERSION --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup $env:INNO_SETUP_VERSION" }
            $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $found) { throw "ISCC.exe not found after installation" }
          Write-Host "Inno Setup compiler: $found"
          (Get-Item $found).VersionInfo.FileVersion

      - name: Build the executables and the unsigned installer; write and verify the checksums
        shell: pwsh
        run: scripts\build_windows_installer.ps1

      - name: Test the installer (silent install into Program Files and into a custom Unicode folder, Start menu, start without administrator rights, update, clean uninstall; no game involved)
        shell: pwsh
        run: scripts\test_windows_installer.ps1

      - name: Check the artifact set (exactly installer and checksums; no game, Microsoft or Funcom file)
        run: |
          v="${{ steps.version.outputs.version }}"
          cd build/windows
          ls -la
          for f in "tsw-forever-$v-windows-setup.exe" SHA256SUMS-windows; do test -s "$f" || { echo "missing artifact: $f" >&2; exit 1; }; done
          sha256sum -c SHA256SUMS-windows
          test "$(ls stage | wc -l)" = 4

      - name: Upload the Windows artifacts (unsigned, internal tests only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: |
            build/windows/tsw-forever-*-windows-setup.exe
            build/windows/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 30
