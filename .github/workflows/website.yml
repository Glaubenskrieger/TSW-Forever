# THE WEB SITE BUILD, shared by development and production (one definition, called by build.yml). It tests the site, assembles it with the SAME assembler that Pages gets
# (scripts/assemble_pages_site.py) and keeps the result as a workflow artifact `tsw-forever-site-<commit>`:
#
#   site/               the files exactly as GitHub Pages serves them (index.html at the top)
#   SHA256SUMS-site     SHA-256 of every file of site/
#   COMMIT              the commit that was built
#
# Production (build.yml, job `site`) deploys exactly these bytes after checking them again; the development repository has no Pages and only keeps the artifact: download it with
# `gh run download <run> -n tsw-forever-site-<commit>` and look at it locally under the production path with `scripts/website_preview.sh --from-artifact <folder>`
# (http://127.0.0.1:<port>/TSW-Forever/). Nothing here publishes: read-only permissions, no Pages, no environment, no secret.
name: website

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit (no stored credentials, full history for the main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a commit that is not part of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }

      - name: Test the web site (links, six languages, update instructions, download logic) before anything is kept
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 nodejs
          python3 -I -W ignore scripts/test_website.py
          python3 -I scripts/test_assemble_pages_site.py
          node scripts/test_website_download.js

      - name: Assemble the site (the static web site only) and write its checksums
        run: |
          set -euo pipefail
          python3 -I scripts/assemble_pages_site.py --website website --out build/site-artifact/site
          (cd build/site-artifact/site && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > build/site-artifact/SHA256SUMS-site
          printf '%s\n' "$GITHUB_SHA" > build/site-artifact/COMMIT
          python3 -I scripts/assemble_pages_site.py --verify build/site-artifact/site
          (cd build/site-artifact/site && sha256sum --check --strict ../SHA256SUMS-site)

      - name: Keep the assembled site (the exact Pages content)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsw-forever-site-${{ github.sha }}
          path: build/site-artifact/
          if-no-files-found: error
          retention-days: 7
