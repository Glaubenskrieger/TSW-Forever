[package]
name = "tsw-launch"
version = "0.4.1"
edition = "2021"
description = "Proof-of-concept launcher for the original The Secret World client (Linux and Windows)"
license = "GPL-3.0-or-later"
publish = false

# Deliberately few dependencies: the client hash (MD5) and the patcher key (TEA) are tiny and implemented here. The core dependency is
# the patch component; Linux also queries XRandR read-only using the already bundled x11rb library.
[dependencies]
tsw-patch = { path = "../patcher" }

# Product decision (2026-11): no automatic update on Windows. The signed-metadata updater (`update::signed`, `update::windows`) is kept for development only and is
# compiled solely with this feature. NO product build, workflow or script may enable it (guards: `scripts/build_windows_installer.ps1` fails on updater strings in a product executable, `launcher-gui/tests/product_build.rs` scans the built window program).
[features]
default = []
windows-self-update = []

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr"] }

[profile.release]
opt-level = 2
debug = false
