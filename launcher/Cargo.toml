[package]
name = "tsw-launch"
version = "0.3.0"
edition = "2021"
description = "Proof-of-concept launcher for the original The Secret World client (Linux and Windows)"
license = "GPL-3.0-or-later"
publish = false

# Deliberately few dependencies: the client hash (MD5) and the patcher key (TEA) are tiny and implemented here. The core dependency is
# the patch component; Linux also queries XRandR read-only using the already bundled x11rb library.
[dependencies]
tsw-patch = { path = "../patcher" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr"] }

[profile.release]
opt-level = 2
debug = false
