[package]
name = "tsw-launcher-gui"
version = "0.4.1"
edition = "2021"
description = "Graphical launcher for the original The Secret World client (front end of tsw-launch)"
publish = false
# Note: Slint is licensed GPL-3.0-only OR royalty-free desktop license OR commercial. See documentation/third-party-components.md.
license = "GPL-3.0-or-later"

[[bin]]
name = "tsw-launcher"
path = "src/main.rs"

[features]
default = []
# Development only, never in a product build: the experimental Windows launcher update (see launcher/Cargo.toml).
windows-self-update = ["tsw-launch/windows-self-update"]

[dependencies]
tsw-launch = { path = "../launcher" }
# the file dialog goes through the desktop portal; both crates are already part of the dependency tree (the winit backend uses them)
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = { version = "2", default-features = false }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-software"] }

# Linux only: access to the winit window, used for ONE purpose (model::physical_window_limits, main.rs pin_window_limits_for_scale_override): Slint 1.18 sets the
# fixed window's min/max size once with scale factor 1.0 when SLINT_SCALE_FACTOR overrides the scale, and never again. The feature adds no crate (winit is already
# part of the backend); the interface is marked unstable by Slint, hence the exact "1" requirement of the lockfile and the guard test in tests/window_limits.rs.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1", default-features = false, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 2
