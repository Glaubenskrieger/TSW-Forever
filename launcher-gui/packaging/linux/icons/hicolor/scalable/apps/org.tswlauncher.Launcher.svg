  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#3a1b1e" stroke-width="2"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#7a151b" stroke-width="5"/>
